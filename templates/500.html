{% extends 'base.html' %}

{% block title %}500 - Lỗi máy chủ nội bộ{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="app-card p-5 shadow-sm">
                <div class="display-1 fw-bold text-danger mb-2">500</div>
                <h4 class="fw-bold text-dark mb-3">Đã xảy ra sự cố máy chủ</h4>
                <p class="text-secondary mb-4">
                    Hệ thống gặp lỗi trong quá trình xử lý yêu cầu. Vui lòng thử lại sau vài giây hoặc liên hệ quản trị viên.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-3 py-2">
                        <i class="bi bi-house-door me-1"></i> Trang chủ
                    </a>
                    <a href="{% url 'product_list' %}" class="btn btn-indigo px-4 py-2">
                        <i class="bi bi-arrow-clockwise me-1"></i> Làm mới trang
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
