<header class="top-header">
    <div class="d-flex align-items-center gap-3">
        <!-- Mobile Toggle Button -->
        <button class="btn btn-light d-lg-none p-2 border" id="sidebarToggleBtn" aria-label="Toggle Sidebar">
            <i class="bi bi-list fs-5"></i>
        </button>

        <!-- Breadcrumb / Page Title Context -->
        <nav aria-label="breadcrumb" class="d-none d-sm-block">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{% url 'dashboard' %}" class="text-decoration-none text-secondary"><i class="bi bi-house-door me-1"></i>Trang chủ</a></li>
                {% block breadcrumb_item %}{% endblock %}
            </ol>
        </nav>
    </div>

    <!-- Right Header Actions -->
    <div class="d-flex align-items-center gap-2">
        <a href="{% url 'product_list' %}" class="btn btn-outline-secondary btn-sm px-3 py-2 rounded-3 d-none d-sm-inline-flex align-items-center gap-1">
            <i class="bi bi-boxes"></i>
            <span>Kho hàng</span>
        </a>

        <!-- Quick Add Product Button -->
        <a href="{% url 'product_create' %}" class="btn btn-indigo btn-sm d-flex align-items-center gap-2 px-3 py-2 shadow-sm rounded-3">
            <i class="bi bi-plus-lg"></i>
            <span class="fw-semibold">Thêm sản phẩm</span>
        </a>
    </div>
</header>
